<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#f4eee2"/>
  <!-- two interlocking rings: Rich & Diana -->
  <g fill="none" stroke-width="26" stroke-linecap="round">
    <circle cx="214" cy="256" r="118" stroke="#2f5141"/>
    <circle cx="298" cy="256" r="118" stroke="#c9a35a"/>
