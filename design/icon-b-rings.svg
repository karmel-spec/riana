  </g>
  <!-- small heart at the shared centre -->
  <path d="M256 236 c-8-18-36-14-36 6 0 16 22 30 36 42 14-12 36-26 36-42 0-20-28-24-36-6z" fill="#2f5141"/>
</svg>
